name: Bridge mirror

# Copies the Obsidian bridge plugin into its public repository,
# glance-apps/dayglance-bridge, which is what Obsidian's community directory
# and BRAT read. The plugin is developed here (dayglance-obsidian-plugin/),
# beside the app and the shared packages it is tested against;
# scripts/bridge-mirror/assemble.mjs builds the mirror's tree.
#
# On a pull request: assemble the tree, build it on its own and run Obsidian's
# lint rules on it, so a change that would break the mirror's build or fail
# the community directory's review fails here first.
# On main (and on demand): the same, then commit the tree to the mirror and,
# when manifest.json carries a version the mirror has not tagged, push that
# tag. The mirror's own release workflow builds the tag into a DRAFT release;
# publishing it is a manual step. The mirror's main keeps the PUBLISHED
# version's manifest.json and versions.json (which Obsidian's directory and
# BRAT read) until the release is published, so a merged version bump never
# advertises a draft (scripts/bridge-mirror/sync.sh; the mirror's
# publish-manifest workflow moves them on publish).
#
# Needs the secret BRIDGE_MIRROR_DEPLOY_KEY: the private half of a deploy key
# with write access on glance-apps/dayglance-bridge.
on:
  pull_request:
    paths:
      - 'dayglance-obsidian-plugin/**'
      - 'packages/agenda-core/**'
      - 'packages/obsidian-format/**'
      - 'scripts/bridge-mirror/**'
      - '.github/workflows/bridge-mirror.yml'
  push:
    branches: [main]
    paths:
      - 'dayglance-obsidian-plugin/**'
      - 'packages/agenda-core/**'
      - 'packages/obsidian-format/**'
      - 'scripts/bridge-mirror/**'
      - '.github/workflows/bridge-mirror.yml'
  workflow_dispatch:

# Mirror runs never overlap: two would race to push. A newer push to the same
# PR cancels the build-only run it replaced.
concurrency:
  group: bridge-mirror-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble the mirror
        run: |
          node scripts/bridge-mirror/assemble.mjs "$RUNNER_TEMP/tree"
          cd "$RUNNER_TEMP/tree"
          # The lockfile is generated for the mirror's own file: paths.
          npm install --package-lock-only --no-audit --no-fund

      - name: Build it on its own
        run: |
          cp -r "$RUNNER_TEMP/tree" "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          npm ci --no-audit --no-fund
          npm run build
          for f in main.js manifest.json styles.css; do test -s "$f" || { echo "::error::$f missing from the build"; exit 1; }; done
          # Obsidian's directory rebuilds each release from source and flags a
          # main.js that differs, so a release build must be reproducible: no
          # build time or other per-run value in it.
          cp main.js "$RUNNER_TEMP/main.first.js"
          npm run build
          cmp main.js "$RUNNER_TEMP/main.first.js" || { echo "::error::Two builds of the same source produced different main.js files"; exit 1; }

      # Obsidian's own lint rules, the ones the community directory's automated
      # review is built on. An error fails here; warnings are only reported.
      - name: Lint with Obsidian's rules
        working-directory: ${{ runner.temp }}/build
        run: npm run lint

      - name: Sync to glance-apps/dayglance-bridge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.BRIDGE_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::The BRIDGE_MIRROR_DEPLOY_KEY secret is not set (see the comment at the top of this workflow)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bridge_mirror
          chmod 600 ~/.ssh/bridge_mirror
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/bridge_mirror -o IdentitiesOnly=yes"

          git clone git@github.com:glance-apps/dayglance-bridge.git "$RUNNER_TEMP/mirror"
          git -C "$RUNNER_TEMP/mirror" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/mirror" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The code follows main here; manifest.json and versions.json on the
          # mirror's main change only when a release is published there (see
          # the script and the mirror's publish-manifest workflow).
          bash scripts/bridge-mirror/sync.sh "$RUNNER_TEMP/tree" "$RUNNER_TEMP/mirror" "$GITHUB_SHA"
