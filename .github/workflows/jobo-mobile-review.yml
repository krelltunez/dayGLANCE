name: Jobo mobile review
on:
  workflow_dispatch:
  push:
    branches: [feature/jobo-mobile-plan-do]
permissions:
  contents: read
concurrency:
  group: jobo-mobile-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: |
          mkdir -p review-artifacts
          set -o pipefail
          npm test 2>&1 | tee review-artifacts/unit-tests.txt
      - name: Production and Android web builds
        run: |
          npm run build
          npm run build:android
      - name: Install browser-test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser interaction tests and actual screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > review-artifacts/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          python scripts/jobo-mobile-recording-review.py
      - name: Archive exact reviewed source
        if: always()
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git archive --format=tar.gz -o review-artifacts/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobo-mobile-review
          path: |
            review-artifacts/
            dist/
          retention-days: 14
